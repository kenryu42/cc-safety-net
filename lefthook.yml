pre-commit:
  piped: true
  jobs:
    - name: knip
      run: bun scripts/project-bun.ts run knip
    - name: biome
      run: bun scripts/project-bun.ts x biome check --write --no-errors-on-unmatched {staged_files}
      glob: "*.{js,ts,cjs,mjs,d.cts,d.mts,json,jsonc}"
      stage_fixed: true
    - name: build
      run: bun scripts/project-bun.ts run build && git add -A dist/

pre-push:
  jobs:
    - name: check
      exclude:
        - "*.md"
        - "**/*.md"
        - "*.yml"
        - "**/*.yml"
        - "*.yaml"
        - "**/*.yaml"
      run: bun scripts/project-bun.ts run check
