name: Publish Release
run-name: publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify-package:
    if: github.repository == 'kenryu42/cc-safety-net'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Bind verification to the immutable tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          git fetch origin --tags
          test "$GITHUB_SHA" = "$(git rev-parse "refs/tags/${TAG}^{commit}")"
          test "$TAG" = "v$(node -p "require('./package.json').version")"
      - name: Build and verify the release tarball
        run: |
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"
          bun install --frozen-lockfile
          bun run check:ci
          bun run build
          git diff --exit-code -- dist assets/cc-safety-net.schema.json THIRD_PARTY_LICENSES.txt
          bun run verify:repository-plugin
          mkdir package-output
          bun run scripts/verify-package.ts --output package-output --git-head "$GITHUB_SHA"
          cd package-output
          sha256sum *.tgz > SHA256SUMS
          cd ..
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: verified-npm-package
          path: package-output
          if-no-files-found: error
          retention-days: 1

  publish-npm:
    needs: verify-package
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-npm-package
          path: package-output
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish the exact verified tarball with OIDC
        env:
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          npm install --global npm@11.5.1
          test "$(npm --version)" = "11.5.1"
          cd package-output
          sha256sum --check SHA256SUMS
          TARBALL=$(printf '%s\n' *.tgz)
          MANIFEST=$(tar -xOf "$TARBALL" package/package.json)
          PACKAGE=$(printf '%s' "$MANIFEST" | jq -r .name)
          VERSION=$(printf '%s' "$MANIFEST" | jq -r .version)
          test "$(printf '%s' "$MANIFEST" | jq -r .gitHead)" = "$GITHUB_SHA"
          EXISTING_VERSION=$(npm view "${PACKAGE}@${VERSION}" version 2>/dev/null || true)
          if [ -n "$EXISTING_VERSION" ]; then
            test "$(npm view "${PACKAGE}@${VERSION}" gitHead)" = "$GITHUB_SHA"
          else
            npm publish "$TARBALL" --access public --provenance --ignore-scripts
          fi

  publish-github-release:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version-file: package.json
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verified-npm-package
          path: package-output
      - name: Validate and complete the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          test "$GITHUB_REF" = "refs/tags/$TAG"
          test "$GITHUB_REF_TYPE" = "tag"
          cd package-output
          sha256sum --check SHA256SUMS
          TARBALL=$(printf '%s\n' *.tgz)
          cd ..
          TARBALL=$(basename "$TARBALL")
          # The releases/tags REST endpoint cannot see draft releases, so the
          # freshly created draft must be looked up by tag name via gh instead.
          release_state() {
            gh release view "$TAG" --json isDraft,isPrerelease,assets \
              --jq '{draft: .isDraft, prerelease: .isPrerelease, assets: [.assets[] | {name}]}'
          }
          if ! release_state > release.json 2>/dev/null; then
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes
            release_state > release.json
          fi
          bun run scripts/release-assets.ts --state release.json --expected SHA256SUMS --expected "$TARBALL" > release-plan.json
          mkdir existing
          for ASSET in $(jq -r '.present[]' release-plan.json); do
            gh release download "$TAG" --pattern "$ASSET" --dir existing
            cmp "existing/$ASSET" "package-output/$ASSET"
          done
          for ASSET in $(jq -r '.missing[]' release-plan.json); do
            gh release upload "$TAG" "package-output/$ASSET"
          done
          release_state > release.json
          bun run scripts/release-assets.ts --state release.json --expected SHA256SUMS --expected "$TARBALL" > release-plan.json
          test "$(jq '.missing | length' release-plan.json)" = "0"
          if [ "$(jq -r .finalizeDraft release-plan.json)" = "true" ]; then
            gh release edit "$TAG" --draft=false
            # GITHUB_TOKEN events do not start workflows, so the release event
            # from the edit above is silent; dispatch the notify workflow directly.
            gh workflow run notify-landing-page-release.yml --field tag="$TAG"
            # Same GITHUB_TOKEN suppression applies to workflow_run listeners:
            # this bot-dispatched run's completion emits no workflow_run event,
            # so the release-notes workflow must be dispatched directly too.
            gh workflow run release-notes.yml
          fi
          release_state > release.json
          bun run scripts/release-assets.ts --state release.json --expected SHA256SUMS --expected "$TARBALL" > release-plan.json
          test "$(jq '.missing | length' release-plan.json)" = "0"
          test "$(jq -r .finalizeDraft release-plan.json)" = "false"
