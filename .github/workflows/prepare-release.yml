name: Prepare Release
run-name: prepare ${{ inputs.version || inputs.bump }} release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Semver bump applied to the version in package.json on main
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: Explicit stable version without a v prefix; overrides bump
        required: false
        type: string
      dry_run:
        description: Validate the complete release without mutating Git
        required: false
        default: false
        type: boolean

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    if: github.repository == 'kenryu42/cc-safety-net'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Resolve the next version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$VERSION" ]; then
            CURRENT=$(jq -r .version package.json)
            [[ "$CURRENT" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            IFS=. read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "$BUMP" in
              major) VERSION="$((MAJOR + 1)).0.0" ;;
              minor) VERSION="${MAJOR}.$((MINOR + 1)).0" ;;
              patch) VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))" ;;
            esac
            echo "Resolved ${BUMP} bump from v${CURRENT}"
          fi
          [[ "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          echo "Preparing v${VERSION}"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate and verify current main
        run: |
          git fetch origin main --tags
          BASE=$(git rev-parse HEAD)
          test "$BASE" = "$(git rev-parse origin/main)"
          test -z "$(git status --porcelain)"
          bun install --frozen-lockfile
          bun run check:ci
          bun run build
          git diff --exit-code -- dist assets/cc-safety-net.schema.json THIRD_PARTY_LICENSES.txt
          bun run verify:repository-plugin
          bun run verify:package
          printf '%s\n' "$BASE" > "$RUNNER_TEMP/prepared-release.base"
          git show-ref --tags > "$RUNNER_TEMP/prepared-release.tags" || true
      - name: Prepare and verify requested version
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          BASE=$(cat "$RUNNER_TEMP/prepared-release.base")
          bun run scripts/prepare-release-files.ts --version "$VERSION"
          # Lint the exact bytes that will be committed and tagged: the publish workflow
          # runs check:ci on the tag, so unformatted prepared files must fail here first.
          bun run lint:ci
          bun run build
          bun run verify:repository-plugin
          bun run verify:package
          bun run scripts/release-transaction.ts --version "$VERSION" --expected-base "$BASE" --dry-run
          tar -czf "$RUNNER_TEMP/prepared-release.tgz" package.json .claude-plugin/plugin.json .codex-plugin/plugin.json kimi.plugin.json assets/cc-safety-net.schema.json dist
          cd "$RUNNER_TEMP"
          sha256sum prepared-release.tgz > prepared-release.tgz.sha256
      - name: Prove dry-run left Git history unchanged
        if: inputs.dry_run
        run: |
          test "$(git rev-parse HEAD)" = "$(cat "$RUNNER_TEMP/prepared-release.base")"
          git show-ref --tags > "$RUNNER_TEMP/prepared-release.tags.after" || true
          cmp "$RUNNER_TEMP/prepared-release.tags" "$RUNNER_TEMP/prepared-release.tags.after"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ !inputs.dry_run }}
        with:
          name: prepared-release
          path: |
            ${{ runner.temp }}/prepared-release.base
            ${{ runner.temp }}/prepared-release.tgz
            ${{ runner.temp }}/prepared-release.tgz.sha256
          if-no-files-found: error
          retention-days: 1

  mutate:
    if: ${{ !inputs.dry_run }}
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.transaction.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: main
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: prepared-release
          path: ${{ runner.temp }}/prepared-release
      - name: Apply the verified release transaction
        id: transaction
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          cd "$RUNNER_TEMP/prepared-release"
          sha256sum --check prepared-release.tgz.sha256
          BASE=$(cat prepared-release.base)
          cd "$GITHUB_WORKSPACE"
          test "$(git rev-parse HEAD)" = "$BASE"
          rm -rf dist
          tar -xzf "$RUNNER_TEMP/prepared-release/prepared-release.tgz"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bun run scripts/release-transaction.ts --version "$VERSION" --expected-base "$BASE"
          printf 'tag=v%s\n' "$VERSION" >> "$GITHUB_OUTPUT"

  dispatch:
    needs: mutate
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch tag-bound publisher
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.mutate.outputs.tag }}
        run: gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref "$TAG" -f tag="$TAG"
